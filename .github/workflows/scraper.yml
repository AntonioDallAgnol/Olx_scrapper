name: OLX Monitor Job

on:
  schedule:
    # Roda nos minutos 3, 13, 23, 33, 43, 53 de cada hora (evita a fila dos múltiplos de 5)
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_olx.py
        
      - name: Salvar histórico no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add anuncios_vistos.json
          # Só commita se houver alteração no arquivo
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza anuncios_vistos.json [skip ci]" && git push)
